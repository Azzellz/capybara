name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch all history for changelog

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows artifacts
        run: pnpm run build:win
        env:
          MAIN_VITE_TITLE: Capybara
          MAIN_VITE_SUBTITLE: A windows platform wireguard client specially built for wg-easy...
          MAIN_VITE_AUTOSYNC_ENABLE: true
          MAIN_VITE_AUTOSYNC_INTERVAL: 5000

      - name: Resolve version
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF
          if ($ref -and $ref.StartsWith('refs/tags/')) {
            $tag = $env:GITHUB_REF_NAME
            if (-not $tag) { $tag = $ref.Substring('refs/tags/'.Length) }
            $version = $tag -replace '^v',''
          } else {
            $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
            $version = $pkg.version
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version resolved: $version"

      - name: Rename win-unpacked folder to capybara
        shell: pwsh
        run: |
          if (Test-Path "dist/win-unpacked") {
            if (Test-Path "dist/capybara-windows") { Remove-Item -Recurse -Force "dist/capybara-windows" }
            Rename-Item -Path "dist/win-unpacked" -NewName "capybara-windows"
          } else {
            Write-Error "win-unpacked dir not found, build may fail."
          }

      - name: Zip dist folder as capybara-windows-version
        shell: pwsh
        run: |
          if (Test-Path "dist/capybara-windows") {
            $zipPath = "dist/capybara-windows-v$env:VERSION.zip"
            if (Test-Path $zipPath) { Remove-Item $zipPath }
            Compress-Archive -Path "dist/capybara-windows" -DestinationPath $zipPath
          } else {
            Write-Error "capybara-windows dir not found, build may fail."
          }

      - name: List built files
        shell: pwsh
        run: |
          Write-Host "Dist contents:"
          Get-ChildItem -Recurse dist | Format-Table -AutoSize

      - name: Resolve previous tag
        id: prev_tag
        shell: pwsh
        run: |
          $tags = git tag --sort=-v:refname
          $arr = $tags -split "`n" | Where-Object { $_ -ne "" }
          if ($arr.Length -ge 2) { $prev = $arr[1] } else { $prev = "" }
          echo "tag=$prev" >> $env:GITHUB_OUTPUT
          Write-Host "Previous tag: $prev"

      - name: Build Changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          fromTag: ${{ steps.prev_tag.outputs.tag }}
          toTag: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release with artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: false
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            dist/capybara-windows-v${{ env.VERSION }}.zip
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
